## IDF Component Manager Manifest File
dependencies:
  # ── LCD 驱动 ── C3 只用 SSD1306 板载驱动，其余 LCD 都不要
  waveshare/esp_lcd_sh8601:
    version: 1.0.2
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_ili9341:
    version: ==1.2.0
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_gc9a01:
    version: ==2.0.1
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_st77916:
    version: ^1.0.1
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_axs15231b:
    version: ^1.0.0
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_st7701:
    version: ^1.1.4
    rules:
    - if: target in [esp32s3, esp32p4]
  espressif/esp_lcd_st7796:
    version: 1.3.5
    rules:
    - if: target in [esp32, esp32s2, esp32s3, esp32p4]
  espressif/esp_lcd_spd2010:
    version: ==1.0.2
    rules:
    - if: target not in [esp32c3]
  espressif/esp_io_expander_tca9554:
    version: ==2.0.0
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_panel_io_additions:
    version: ^1.0.1
    rules:
    - if: target not in [esp32c3]
  78/esp_lcd_nv3023:
    version: ~1.0.0
    rules:
    - if: target not in [esp32c3]
  78/esp-wifi-connect:
    version: ~3.0.2      # C3 必用：WiFi STA/AP
  espressif/esp_audio_effects:
    version: ~1.2.0      # audio_service.h include 了 esp_ae_rate_cvt.h，C3 也得装（Kconfig 关掉 USE_AUDIO_PROCESSOR 就不调用）
  espressif/esp_audio_codec:
    version: ~2.4.0      # C3 必用：no_audio_codec 通过这个
  78/esp-ml307:
    version: ~3.5.3      # board.h 引用了 ml307 的 http/web_socket/mqtt/udp 头；C3 也装但用 WiFi 不用 4G
  78/xiaozhi-fonts:
    version: ~1.5.5      # C3 必用：LVGL 字体
  espressif/led_strip:
    version: ~3.0.1      # C3 必用：可挂 WS2812
  espressif/esp_codec_dev:
    version: ~1.5        # C3 必用
  espressif/esp-sr:
    version: ~2.2.0
    rules:
    - if: target in [esp32s3, esp32p4, esp32c3]  # C3 装基础库（model_path.h 头文件），但 Kconfig 关掉 AFE
  # 注：esp-sr 头文件被 audio_service.cc 直接 include，所以 C3 也得装。Kconfig 关掉 USE_AFE_WAKE_WORD 即可
  # 不让 AFE 跑，模型也不打 bin。
  espressif/button:
    version: ~4.1.3
  espressif/knob:
    version: ^1.0.0      # knob.h include 了 iot_knob.h，C3 也装（CONFIG_KNOB 不开就不调）
  espressif/esp_video:
    version: ==1.3.1
    rules:
    - if: target in [esp32s3, esp32p4, esp32c3]  # C3 装基础库（esp32_camera.cc 头），Kconfig 关掉 CAMERA 就不编
  espressif/esp_image_effects:
    version: ^1.0.1
    rules:
    - if: target in [esp32s3, esp32p4, esp32c3]  # C3 装基础库（image_to_jpeg.cpp 用到），但 lvgl_display.cc 里的调用 Kconfig 关掉就不调
  espressif/esp_lcd_touch_ft5x06:
    version: ~1.0.7
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_touch_gt911:
    version: ^1
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_touch_gt1151:
    version: ^1
    rules:
    - if: target not in [esp32c3]
  waveshare/esp_lcd_touch_cst9217:
    version: ^1.0.3
    rules:
    - if: target not in [esp32c3]
  espressif/esp_lcd_touch_cst816s:
    version: ~1.0.6
    rules:
    - if: target not in [esp32c3]
  lvgl/lvgl:
    version: ~9.3.0      # 保留：S3 板用
  esp_lvgl_port:
    version: ~2.6.0      # 保留：S3 板用
  espressif/esp_io_expander_tca95xx_16bit:
    version: ^2.0.0
    rules:
    - if: target not in [esp32c3]
  espressif2022/image_player:
    version: ^1.1.1
    rules:
    - if: target not in [esp32c3]   # C3 不用大表情播放器
  espressif2022/esp_emote_expression:
    version: ^0.1.0      # emote_display.h include 了 expression_emote.h，C3 也得装（Kconfig 关掉 EMOTE 就不调用）
  espressif/adc_mic:
    version: ^0.2.1
    rules:
    - if: target not in [esp32c3]   # C3 用 I2S mic，不用 ADC mic
  espressif/esp_mmap_assets:
    version: '>=1.2'
    rules:
    - if: target not in [esp32c3]   # C3 无 SPIRAM 装不下 mmap 资源
  txp666/otto-emoji-gif-component:
    version: ^1.0.3
    rules:
    - if: target in [esp32s3]
  espressif/adc_battery_estimation:
    version: ^0.2.0      # adc_battery_monitor.h 用到；C3 也装（Kconfig 关掉 BATTERY 就不调用）
  espressif/esp_new_jpeg:
    version: ^0.6.1      # image_to_jpeg.cpp 用 esp_jpeg_*.h；C3 也得装（Kconfig 关掉 CAMERA 就不调用）

  # SenseCAP Watcher Board
  wvirgil123/sscma_client:
    version: 1.0.2
    rules:
    - if: target in [esp32s3]

  tny-robotics/sh1106-esp-idf:
    version: ^1.0.0
    rules:
    - if: target not in [esp32c3]   # C3 用 SSD1306 不用 SH1106
  waveshare/esp_lcd_jd9365_10_1:
    version: '*'
    rules:
    - if: target in [esp32p4]
  waveshare/esp_lcd_st7703:
    version: '*'
    rules:
    - if: target in [esp32p4]
  espressif/esp32_p4_function_ev_board:
    version: ^5.0.3
    rules:
    - if: target in [esp32p4]
  espressif/esp_lcd_ili9881c:
    version: ^1.0.1
    rules:
    - if: target in [esp32p4]
  espressif/esp_lcd_ek79007:
    version: ^1.0.3
    rules:
    - if: target in [esp32p4]
  espressif/esp_hosted:
    version: 2.0.17
    rules:
    - if: target in [esp32h2, esp32p4]
  espressif/esp_wifi_remote:
    version: '*'
    rules:
    - if: target in [esp32p4]
  espfriends/servo_dog_ctrl:
    version: ^0.1.8
    rules:
    - if: target in [esp32c3]       # 实际 C3 也不用 L298N 走舵机；保留以兼容旧工程
  # 注：上面一行原本是给 C3 用舵机狗板子的。我们这版 C3 板子用 L298N+电机，
  # 不需要 servo_dog_ctrl。如要彻底删，把 if: 改成 false 即可。

  llgok/cpp_bus_driver:
    version: 1.1.0
    rules:
    - if: target in [esp32p4]

  espressif/bmi270_sensor:
    version: ^0.1.0
    rules:
    - if: target in [esp32s3, esp32c5]

  ## Required IDF version
  idf:
    version: '>=5.4.0'
  espressif/esp_lcd_touch_st7123:
    version: ^1.0.0
    rules:
    - if: target not in [esp32c3]
